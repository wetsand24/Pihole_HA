global_defs {
  router_id pihole1
  enable_script_security
  script_user root
}
vrrp_script chk_ftl {
  script "/usr/local/bin/chk-ftl"
  interval 2
  timeout 3
  fall 3
  rise 2
  weight -100
}
vrrp_instance PIHOLE {
  state BACKUP
  interface eth0
  virtual_router_id 53
  priority 150
  advert_int 1
  preempt_delay 30
  unicast_src_ip 10.37.0.41
  unicast_peer {
    10.37.0.42
  }
  virtual_ipaddress {
    10.37.0.40/24
  }
  track_script {
    chk_ftl
  }
}
